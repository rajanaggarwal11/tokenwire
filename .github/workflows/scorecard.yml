# OpenSSF Scorecard: checks this repository's supply-chain practices (pinned actions,
# token permissions, branch protection, …) and publishes the result to scorecard.dev.
# Results are not uploaded to code scanning: several checks (project age, solo
# code review, fuzzing) are not actionable and would sit as open alerts. https://github.com/ossf/scorecard-action
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"
  branch_protection_rule:
  workflow_dispatch:

# Nothing at the workflow level; publishing results requires that.
permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # publish_results: the OIDC token proves the results came from this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
