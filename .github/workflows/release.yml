name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required for npm provenance (pnpm_config_provenance below): the published
      # package is signed with a verifiable link back to the commit and workflow
      # that built it.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No dependency cache in the job that publishes: a poisoned cache entry
          # written by another workflow must not reach the package.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Create release PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset version
          # Publishing needs npm credentials. Until an NPM_TOKEN secret (or trusted
          # publishing) exists, this step only opens the version PR; publishing is
          # done locally with `pnpm changeset publish`. The moment the secret exists,
          # publishing from CI turns itself on.
          publish-script: ${{ secrets.NPM_TOKEN != '' && 'pnpm changeset publish' || '' }}
          commit-message: "chore: release"
          pr-title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # pnpm 11 publishes natively and reads only pnpm_config_* from the
          # environment; NPM_CONFIG_PROVENANCE covers an npm-based publish.
          pnpm_config_provenance: "true"
          NPM_CONFIG_PROVENANCE: "true"
